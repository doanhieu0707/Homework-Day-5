<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>CV Flex</title>
</head>
<body>
    <div class="cv">
        <div class="container">
            <!-- SIDEBAR -->
            <div class="sidebar">
                <img src="https://via.placeholder.com/150" alt="avatar" />
                <h2>CHRISTOPHER MILLER</h2>
                <p>City, Country</p>
                <p>0123 123 1234</p>
                <p>email@gmail.com</p>

                <h3>SKILLS</h3>
                <ul>
                    <li>HTML, CSS</li>
                    <li>JavaScript</li>
                    <li>ReactJS</li>
                </ul>
            </div>

            <!-- MAIN CONTENT -->
            <div class="infor">
                <div class="header">
                    <h1 class="heading-1">CHRISTOPHER MILLER</h1>
                    <p>City, Country | 0123 123 1234 | email@gmail.com</p>
                </div>

                <div class="work">
                    <h2 class="heading-2">WORK EXPERIENCE</h2>
                </div>

                <!-- giữ nguyên các phần part của bạn -->
                <div class="part">
                    <div class="title">
                        <span>JOB TITLE | Company</span>
                        <span>Date - Present</span>
                    </div>
                    <ul>
                        <li>Example content...</li>
                    </ul>
                </div>

                <div class="footer">
                    <h2>EDUCATION</h2>
                    <p>Master Degree...</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
