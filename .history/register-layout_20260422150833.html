<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Register Layout</title>
</head>
<body>

    <div class="container">

        <!-- LEFT (FORM) -->
        <div class="left">
            <div class="form-box">
                <h2>Register</h2>
                <p>Lorem ipsum dolor sit amet elit.</p>

                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
                <input type="password" placeholder="Re-type Password">

                <label class="check">
                    <input type="checkbox"> Agree Terms & Conditions
                </label>

                <button class="btn primary">Register</button>

                <p class="or">— or —</p>

                <button class="btn fb">Register with Facebook</button>
                <button class="btn tw">Register with Twitter</button>
                <button class="btn gg">Register with Google</button>
            </div>
        </div>

        <!-- RIGHT (IMAGE) -->
        <div class="right">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="">
        </div>

    </div>

</body>
</html>
