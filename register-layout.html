<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <title>Register Layout</title>
    </head>
    <body>
        <div class="container">
            <div class="left">
                <div class="form-box">
                    <h2>Register</h2>
                    <p>
                        Lorem ipsum dolor sit amet consectetur adipisicing elit.
                    </p>
                    <input type="email" placeholder="Email" />
                    <input type="password" placeholder="Password" />
                    <input type="password" placeholder="Re-type Password" />

                    <label class="check">
                        <input type="checkbox" /> Agree Terms & Conditions
                    </label>

                    <button class="btn primary">Register</button>

                    <p class="or">— or —</p>

                    <button class="btn fb">Register with Facebook</button>
                    <button class="btn tw">Register with Twitter</button>
                    <button class="btn gg">Register with Google</button>
                </div>
            </div>

            <div class="right">
                <img
                    src="https://images.unsplash.com/photo-1773332598501-f8612761781a?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt=""
                />
            </div>
        </div>
    </body>
</html>
